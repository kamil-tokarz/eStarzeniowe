services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estarzeniowe
      POSTGRES_USER: estarzeniowe
      POSTGRES_PASSWORD: estarzeniowe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estarzeniowe -d estarzeniowe"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - estarzeniowe_pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://estarzeniowe:estarzeniowe@db:5432/estarzeniowe?schema=public
      SESSION_COOKIE_NAME: estarzeniowe_session
      SESSION_TTL_DAYS: 14
      APP_ENV: test
      NEXT_PUBLIC_APP_NAME: eStarzeniowe
      UPLOAD_DIR: /data/uploads
    command: sh -c "npx prisma db push && npx prisma db seed && npm start"
    ports:
      - "3000:3000"
    volumes:
      - estarzeniowe_uploads:/data/uploads

volumes:
  estarzeniowe_pgdata:
  estarzeniowe_uploads:
